# Mosquitto Configuration for ENSAM IIoT Pipeline
# Protocoles : MQTT TCP (1883) + WebSockets (9001)

# Standard MQTT listener
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for Next.js Web Dashboard
listener 9001 0.0.0.0
protocol websockets

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Security
# In initial dev/lab mode: allow anonymous connections.
# For production/hardened demo, credentials and ACL are configured.
allow_anonymous true

